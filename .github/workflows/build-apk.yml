name: 바다조황 APK 빌드

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: Java 17 준비
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Node 20 준비
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 프로젝트 파일 자동 생성
        run: |
          set -e
          mkdir -p src

          cat > package.json <<'ENDOFFILE'
          {
            "name": "badajohwang",
            "private": true,
            "version": "1.0.0",
            "type": "module",
            "scripts": { "build": "vite build" },
            "dependencies": {
              "@capacitor/android": "^6.2.1",
              "@capacitor/core": "^6.2.1",
              "react": "^18.3.1",
              "react-dom": "^18.3.1"
            },
            "devDependencies": {
              "@capacitor/cli": "^6.2.1",
              "@vitejs/plugin-react": "^4.7.0",
              "vite": "^5.4.21"
            }
          }
          ENDOFFILE

          cat > capacitor.config.json <<'ENDOFFILE'
          {
            "appId": "com.badajohwang.app",
            "appName": "바다조황",
            "webDir": "dist"
          }
          ENDOFFILE

          cat > vite.config.js <<'ENDOFFILE'
          import { defineConfig } from 'vite'
          import react from '@vitejs/plugin-react'
          export default defineConfig({ plugins: [react()] })
          ENDOFFILE

          cat > index.html <<'ENDOFFILE'
          <!doctype html>
          <html lang="ko">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
              <title>바다조황</title>
            </head>
            <body>
              <div id="root"></div>
              <script type="module" src="/src/main.jsx"></script>
            </body>
          </html>
          ENDOFFILE

          cat > src/main.jsx <<'ENDOFFILE'
          import React from 'react'
          import { createRoot } from 'react-dom/client'
          import './index.css'
          import App from './App.jsx'
          createRoot(document.getElementById('root')).render(<App />)
          ENDOFFILE

          cat > src/index.css <<'ENDOFFILE'
          html, body, #root { margin: 0; padding: 0; background: #0a1929; }
          body { -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
          ENDOFFILE

          echo "--- 생성된 파일 ---"
          ls -R src package.json index.html vite.config.js capacitor.config.json

      - name: 패키지 설치
        run: npm install

      - name: 화면 빌드
        run: npx vite build

      - name: 안드로이드 프로젝트 생성
        run: npx cap add android

      - name: 앱 아이콘 적용
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#1D5272' --splashBackgroundColor '#1D5272'

      - name: 안드로이드로 복사
        run: npx cap sync android

      - name: 서명키 복원
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 시크릿이 없습니다. Settings → Secrets and variables → Actions 에서 등록하세요."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\n\r' | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "keystore 크기: $(stat -c%s "$RUNNER_TEMP/release.keystore") bytes"

      - name: 릴리스 서명 설정 추가
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set -e
          cat >> android/app/build.gradle <<ENDOFGRADLE

          // ── 릴리스 서명 설정 (GitHub Actions에서 자동 추가) ──
          android {
              defaultConfig {
                  versionCode ${VERSION_CODE}
                  versionName "1.0.${VERSION_CODE}"
              }
              signingConfigs {
                  release {
                      storeFile file(System.getenv("KEYSTORE_PATH"))
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          ENDOFGRADLE
          echo "--- build.gradle 끝부분 ---"
          tail -25 android/app/build.gradle

      - name: 릴리스 APK / AAB 만들기
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          chmod +x ./android/gradlew
          cd android
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: 서명 확인
        run: |
          set -e
          APK=android/app/build/outputs/apk/release/app-release.apk
          ls -la "$APK"
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          echo "build-tools: $BT"
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "$APK"

      - name: APK 내려받기 준비 (폰 설치용)
        uses: actions/upload-artifact@v4
        with:
          name: badajohwang-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: AAB 내려받기 준비 (플레이스토어용)
        uses: actions/upload-artifact@v4
        with:
          name: badajohwang-aab-playstore
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
